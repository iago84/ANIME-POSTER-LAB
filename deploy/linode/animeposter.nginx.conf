# =============================================================================
#  animeposter.nginx.conf — Vhost nginx delante de uvicorn (0-Docker)
#  Derivado de ARTEFACTOS_TRAE/C3_svc.nginx.conf.template.
#  Copiar a /etc/nginx/sites-available/animeposter y enlazar en sites-enabled
#  (lo hace SETUP_ALL.sh). Sustituye el server_name por el dominio real.
# =============================================================================

upstream animeposter_app {
    server 127.0.0.1:8012 fail_timeout=0;
}

server {
    listen 80;
    listen [::]:80;
    server_name animeposter.naira-studio.com;

    client_max_body_size 5m;

    # --- Desafío ACME (Let's Encrypt webroot) ---
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    # --- API (proxy a uvicorn) ---
    location / {
        proxy_pass http://animeposter_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    # --- Cabeceras de seguridad ---
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
}
